name: Deploy Laravel Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PHP 8.3 and Composer
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            php8.3-cli php8.3-mbstring php8.3-xml php8.3-curl \
            php8.3-zip php8.3-mysql php8.3-intl unzip
          curl -sS https://getcomposer.org/installer | php -- --2
          sudo mv composer.phar /usr/local/bin/composer
          php -v
          composer --version

      - name: Install Laravel Dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
          COMPOSER_MAX_PARALLEL_HTTP: 4
        run: |
          attempt=1
          max_attempts=5
          until composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "composer install failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "composer install failed (attempt ${attempt}/${max_attempts}); retrying after GitHub rate limit..."
            sleep $((attempt * 20))
            attempt=$((attempt + 1))
          done

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy to Hostinger
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          echo "Deploying files to Hostinger..."
          sshpass -e rsync -avz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.backup' \
            --exclude='.env.production' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            -e "ssh -o StrictHostKeyChecking=no -p 65002" \
            ./ u407529782@145.79.26.191:/home/u407529782/domains/obtainsolutions.com/public_html/

      - name: Run Laravel Commands
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -p 65002 u407529782@145.79.26.191 << 'EOF'
          set -e
          cd /home/u407529782/domains/obtainsolutions.com/public_html/

          mkdir -p \
            storage/framework/cache \
            storage/framework/sessions \
            storage/framework/views \
            storage/logs \
            bootstrap/cache
          chmod -R ug+rwx storage bootstrap/cache

          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          rm -f public/storage
          ln -sfn /home/u407529782/domains/obtainsolutions.com/public_html/storage/app/public \
            /home/u407529782/domains/obtainsolutions.com/public_html/public/storage
          chmod -R 755 storage
          EOF

      - name: Completion Message
        run: echo "Laravel application deployed successfully!"
