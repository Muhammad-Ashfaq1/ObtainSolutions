name: Deploy Laravel Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify PHP Version
        run: php -v && composer --version

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Laravel Dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
          COMPOSER_MAX_PARALLEL_HTTP: 4
        run: |
          attempt=1
          max_attempts=5
          until composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "composer install failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "composer install failed (attempt ${attempt}/${max_attempts}); retrying after GitHub rate limit..."
            sleep $((attempt * 20))
            attempt=$((attempt + 1))
          done

      # Install sshpass
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      # Deploy files to Hostinger
      - name: Deploy to Hostinger
        run: |
          echo "Deploying files to Hostinger..."
          sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -avz -e "ssh -o StrictHostKeyChecking=no -p 65002" ./ u407529782@145.79.26.191:/home/u407529782/domains/obtainsolutions.com/public_html/

      # Run Laravel Commands
      - name: Run Laravel Commands
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p 65002 u407529782@145.79.26.191 << 'EOF'
          cd /home/u407529782/domains/obtainsolutions.com/public_html/
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan optimize:clear
          # Set correct permissions for storage directory first
          chmod -R 755 /home/u407529782/domains/obtainsolutions.com/public_html/storage
          # Remove existing symbolic link if it exists
          rm -f /home/u407529782/domains/obtainsolutions.com/public_html/public/storage
          # Create symbolic link for storage
          ln -sfn /home/u407529782/domains/obtainsolutions.com/public_html/storage/app/public /home/u407529782/domains/obtainsolutions.com/public_html/public/storage
          # Set permissions for the public directory (but not the symlink itself)
          chmod -R 755 /home/u407529782/domains/obtainsolutions.com/public_html/public
          EOF

      # Completion message
      - name: Completion Message
        run: echo "Laravel application deployed successfully!"
