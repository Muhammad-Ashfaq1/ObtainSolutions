name: Deploy Laravel Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Test SSH Connection
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          if [ -z "$SSHPASS" ]; then
            echo "SSH_PASSWORD secret is empty or missing."
            echo "Add it in GitHub → Settings → Secrets and variables → Actions."
            echo "Use the same Hostinger SSH password as the pos / syntx-solutions repos."
            exit 1
          fi

          SSHPASS="$(printf '%s' "$SSHPASS" | tr -d '\r\n')"
          export SSHPASS

          echo "Testing SSH login to Hostinger..."
          sshpass -e ssh -o StrictHostKeyChecking=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -p 65002 \
            u407529782@145.79.26.191 'echo SSH_OK && whoami'

      - name: Deploy to Hostinger
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          SSHPASS="$(printf '%s' "$SSHPASS" | tr -d '\r\n')"
          export SSHPASS

          echo "Deploying files to Hostinger..."
          sshpass -e rsync -avz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.env' \
            --exclude='.env.backup' \
            --exclude='.env.production' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            -e "ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -p 65002" \
            ./ u407529782@145.79.26.191:/home/u407529782/domains/obtainsolutions.com/public_html/

      - name: Install dependencies and run Laravel commands
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          SSHPASS="$(printf '%s' "$SSHPASS" | tr -d '\r\n')"
          export SSHPASS

          sshpass -e ssh -o StrictHostKeyChecking=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -p 65002 \
            u407529782@145.79.26.191 bash -s << 'EOF'
          set -e
          cd /home/u407529782/domains/obtainsolutions.com/public_html/

          mkdir -p \
            storage/framework/cache \
            storage/framework/sessions \
            storage/framework/views \
            storage/logs \
            bootstrap/cache
          chmod -R ug+rwx storage bootstrap/cache

          if [ ! -f composer.phar ]; then
            php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
            php composer-setup.php --2 --filename=composer.phar
            rm -f composer-setup.php
          fi

          export COMPOSER_MEMORY_LIMIT=-1
          export COMPOSER_MAX_PARALLEL_HTTP=1

          set +e
          php composer.phar config -g repos.packagist composer https://mirrors.aliyun.com/composer/
          php composer.phar update --lock --no-install --no-dev --no-interaction --no-plugins
          php composer.phar install --no-dev --optimize-autoloader --no-interaction
          composer_status=$?

          if [ "$composer_status" -ne 0 ]; then
            echo "Aliyun mirror failed; trying Tencent Cloud mirror..."
            php composer.phar config -g repos.packagist composer https://mirrors.cloud.tencent.com/composer/
            php composer.phar update --lock --no-install --no-dev --no-interaction --no-plugins
            php composer.phar install --no-dev --optimize-autoloader --no-interaction
            composer_status=$?
          fi
          set -e

          if [ "$composer_status" -ne 0 ]; then
            echo "composer install failed from both mirrors"
            exit 1
          fi

          php artisan migrate --force
          php artisan db:seed --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          rm -f public/storage
          ln -sfn /home/u407529782/domains/obtainsolutions.com/public_html/storage/app/public \
            /home/u407529782/domains/obtainsolutions.com/public_html/public/storage
          chmod -R 755 storage
          EOF

      - name: Completion Message
        run: echo "Laravel application deployed successfully!"
